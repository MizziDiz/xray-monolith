name: DIF build

on:
  push:
    branches: [ "dif-shader-bus" ]
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: src/engine-vs2022.sln

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        buildconf: ["DX11-AVX", "DX11"]

    steps:
    - name: Configure Pagefile
      uses: al-cheb/configure-pagefile-action@v1.3
      with:
        minimum-size: 8GB
        maximum-size: 8GB
        disk-root: "C:"

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Init submodules
      uses: snickerbockers/submodules-init@v4

    - name: setup-msbuild
      uses: microsoft/setup-msbuild@v1.3.1
      with:
        msbuild-architecture: "x64"

    - name: Build ${{matrix.buildconf}}
      run: msbuild /m /p:Configuration=${{matrix.buildconf}} ${{env.SOLUTION_FILE_PATH}}

    - name: Upload
      uses: actions/upload-artifact@v4.6.0
      with:
        name: ${{matrix.buildconf}}_exe
        path: |
          ./_build/_game/bin_dbg/*.exe
          ./_build/_game/bin_dbg/*.pdb
        if-no-files-found: "error"
        retention-days: 7
